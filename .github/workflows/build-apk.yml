name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Allow network images in release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in s:
              s = s.replace("    <application", permission + "    <application", 1)
          p.write_text(s)
          PY

      # Keep only generated Android/tooling files; restore the committed app.
      - name: Restore app sources
        run: |
          git checkout -- lib
          rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astrolabica-quiz-cosmos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
