name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android

      # flutter create can regenerate project files in the working tree.
      # Restore the repository's real Dart sources and remove the generated
      # placeholder test before analysis/build.
      - name: Restore app sources
        run: |
          git checkout -- lib
          rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astrolabica-quiz-cosmos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
